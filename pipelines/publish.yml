name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - main
pr: [main]

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco

parameters:
  - name: publishPackage
    displayName: 🚀 Publish windows-mutex
    type: boolean
    default: false

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: windows-mutex

        buildSteps:
          - script: npm ci
            displayName: Install dependencies

          # the rest of the build steps are part of the 'prepack' script, automatically run when the pipeline invokes 'npm pack'

        testPlatforms:
          - name: Windows
            nodeVersions:
              - 22.x

          - name: macOS
            nodeVersions:
              - 22.x

          - name: linux
            nodeVersions:
              - 22.x

        testSteps:
          - script: npm ci
            displayName: Install dependencies

          - script: npm test
            displayName: Compile & test npm package

        apiScanSoftwareName: 'vscode-windows-mutex'
        apiScanSoftwareVersion: '0.5'

        publishPackage: ${{ parameters.publishPackage }}
        packagePlatform: Windows